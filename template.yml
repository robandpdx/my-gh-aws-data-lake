AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'AWS infrastructure for ingesting GitHub webhooks and enterprise audit logs into an S3 data lake.'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Environment stage for deployment.
  owner:
    Type: String
    Default: robandpdx
    Description: Owner applied to all taggable resources.
  GitHubEnterpriseSlug:
    Type: String
    AllowedPattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$'
    ConstraintDescription: Enter the case-sensitive GitHub enterprise slug.
    Description: Case-sensitive enterprise slug used to restrict GitHub audit-log OIDC access.
  CreateGitHubAuditLogOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set to true only when this AWS account does not already have the GitHub audit-log OIDC provider.
  AuditLogAlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address to subscribe to audit-log pipeline alarms.
  AuditLogNormalizerReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 100
    Description: Reserved and maximum SQS concurrency for the audit-log normalizer.
  WebhookSilverScheduleExpression:
    Type: String
    Default: rate(1 hour)
    Description: EventBridge schedule for incremental webhook silver normalization.
  WebhookSilverNumberOfWorkers:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 100
    Description: Number of G.1X workers allocated to the webhook silver Glue job.

Conditions:
  ShouldCreateGitHubAuditLogOidcProvider:
    Fn::Equals:
      - Ref: CreateGitHubAuditLogOidcProvider
      - 'true'
  HasAuditLogAlarmEmail:
    Fn::Not:
      - Fn::Equals:
          - Ref: AuditLogAlarmEmail
          - ''

Resources:
  # 1. Amazon S3 Bucket for Data Lake Storage
  WebhookS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "github-webhooks-parquet-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  WebhookS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebhookS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt WebhookS3Bucket.Arn
              - !Sub "${WebhookS3Bucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # 2. AWS Glue Database
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "github_webhooks_${Environment}"
        Description: "Database for GitHub webhooks ingested as Parquet"

  # 3. AWS Glue Table (Defines Parquet schema with core metadata and flexible payload)
  GlueTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: events
        Description: "Table storing GitHub webhook events"
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          has_encrypted_data: 'false'
        StorageDescriptor:
          Location: !Sub "s3://${WebhookS3Bucket}/webhooks/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          Compressed: true
          NumberOfBuckets: -1
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
            Parameters:
              serialization.format: '1'
          Columns:
            - Name: id
              Type: string
              Comment: "GitHub Event ID"
            - Name: received_at_epoch_ms
              Type: bigint
              Comment: "API Gateway request receipt time as Unix epoch milliseconds"
            - Name: event_type
              Type: string
              Comment: "GitHub Event Type header"
            - Name: action
              Type: string
              Comment: "Specific action taken"
            - Name: repository
              Type: struct<id:bigint,name:string,full_name:string,html_url:string>
              Comment: "Basic repository metadata struct"
            - Name: sender
              Type: struct<id:bigint,login:string,type:string>
              Comment: "User who triggered the event"
            - Name: raw_payload
              Type: string
              Comment: "Full JSON string payload to handle GitHub polymorphism safely"
        PartitionKeys:
          - Name: year
            Type: string
          - Name: month
            Type: string
          - Name: day
            Type: string

  # 4. CloudWatch Logs for Firehose delivery errors
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/github-webhooks-parquet-stream-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: owner
          Value: !Ref owner

  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: S3Delivery

  # 5. IAM Role for Firehose
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirehoseDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt WebhookS3Bucket.Arn
                  - !Sub "${WebhookS3Bucket.Arn}/*"
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/events"
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FirehoseLogGroup}:log-stream:${FirehoseLogStream}"
      Tags:
        - Key: owner
          Value: !Ref owner

  # 6. Amazon Data Firehose Delivery Stream
  FirehoseDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "github-webhooks-parquet-stream-${Environment}"
      DeliveryStreamType: DirectPut
      Tags:
        - Key: owner
          Value: !Ref owner
      ExtendedS3DestinationConfiguration:
        RoleARN: !GetAtt FirehoseRole.Arn
        BucketARN: !GetAtt WebhookS3Bucket.Arn
        Prefix: "webhooks/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
        ErrorOutputPrefix: "webhooks-errors/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/!{firehose:error-output-type}/"
        BufferingHints:
          IntervalInSeconds: 300
          SizeInMBs: 64
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream
        CompressionFormat: UNCOMPRESSED # Format conversion handles its own internal Parquet compression (Snappy)
        DataFormatConversionConfiguration:
          Enabled: true
          InputFormatConfiguration:
            Deserializer:
              OpenXJsonSerDe: {}
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe: {}
          SchemaConfiguration:
            DatabaseName: !Ref GlueDatabase
            TableName: events
            RoleARN: !GetAtt FirehoseRole.Arn
            Region: !Ref AWS::Region
            VersionId: LATEST

  # 7. IAM Role for API Gateway to write directly to Firehose
  ApiGatewayFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayFirehosePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                Resource: !GetAtt FirehoseDeliveryStream.Arn
      Tags:
        - Key: owner
          Value: !Ref owner

  # 8. Amazon API Gateway (REST API)
  WebhookApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "github-webhooks-ingest-${Environment}"
      Description: "API Gateway backend endpoint to ingest GitHub Webhooks directly into Data Firehose"
      Tags:
        - Key: owner
          Value: !Ref owner

  WebhookResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt WebhookApi.RootResourceId
      PathPart: events
      RestApiId: !Ref WebhookApi

  # POST Method integrating straight to Firehose via AWS Service Proxy
  WebhookPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref WebhookResource
      RestApiId: !Ref WebhookApi
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:firehose:action/PutRecord"
        Credentials: !GetAtt ApiGatewayFirehoseRole.Arn
        PassthroughBehavior: NEVER
        RequestTemplates:
          application/json: !Sub |
            #set($quote = '"')
            #set($root = $input.path('$'))
            #set($rawPayload = $util.escapeJavaScript($input.body).replaceAll("\\'","'"))
            #set($deliveryId = $util.escapeJavaScript($input.params().header.get('X-GitHub-Delivery')).replaceAll("\\'","'"))
            #set($eventType = $util.escapeJavaScript($input.params().header.get('X-GitHub-Event')).replaceAll("\\'","'"))
            #set($receivedAtEpochMs = $context.requestTimeEpoch)
            #set($action = '')
            #if($root.containsKey('action'))
              #set($action = $util.escapeJavaScript($root.action).replaceAll("\\'","'"))
            #end
            #set($repositoryField = "")
            #if($root.containsKey('repository'))
              #set($repository = $input.json('$.repository'))
              #set($repositoryField = ",${!quote}repository${!quote}:${!repository}")
            #end
            #set($senderField = "")
            #if($root.containsKey('sender'))
              #set($sender = $input.json('$.sender'))
              #set($senderField = ",${!quote}sender${!quote}:${!sender}")
            #end
            #set($enrichedPayload = "{${!quote}id${!quote}:${!quote}${!deliveryId}${!quote},${!quote}received_at_epoch_ms${!quote}:${!receivedAtEpochMs},${!quote}event_type${!quote}:${!quote}${!eventType}${!quote},${!quote}action${!quote}:${!quote}${!action}${!quote}${!repositoryField}${!senderField},${!quote}raw_payload${!quote}:${!quote}${!rawPayload}${!quote}}")
            {
              "DeliveryStreamName": "${FirehoseDeliveryStream}",
              "Record": {
                "Data": "$util.base64Encode($enrichedPayload)"
              }
            }
          application/x-www-form-urlencoded: !Sub |
            #set($quote = '"')
            #set($encodedPayload = $input.body.substring(8))
            #set($payload = $util.urlDecode($encodedPayload))
            #set($parsedPayload = $util.parseJson($payload))
            #set($rawPayload = $util.escapeJavaScript($payload).replaceAll("\\'","'"))
            #set($deliveryId = $util.escapeJavaScript($input.params().header.get('X-GitHub-Delivery')).replaceAll("\\'","'"))
            #set($eventType = $util.escapeJavaScript($input.params().header.get('X-GitHub-Event')).replaceAll("\\'","'"))
            #set($receivedAtEpochMs = $context.requestTimeEpoch)
            #set($action = '')
            #if($parsedPayload.containsKey('action'))
              #set($action = $util.escapeJavaScript($parsedPayload.action).replaceAll("\\'","'"))
            #end
            #set($repositoryField = "")
            #if($parsedPayload.containsKey('repository'))
              #set($repository = $parsedPayload.repository)
              #set($repositoryName = $util.escapeJavaScript($repository.name).replaceAll("\\'","'"))
              #set($repositoryFullName = $util.escapeJavaScript($repository.full_name).replaceAll("\\'","'"))
              #set($repositoryUrl = $util.escapeJavaScript($repository.html_url).replaceAll("\\'","'"))
              #set($repositoryJson = "{${!quote}id${!quote}:$repository.id,${!quote}name${!quote}:${!quote}${!repositoryName}${!quote},${!quote}full_name${!quote}:${!quote}${!repositoryFullName}${!quote},${!quote}html_url${!quote}:${!quote}${!repositoryUrl}${!quote}}")
              #set($repositoryField = ",${!quote}repository${!quote}:${!repositoryJson}")
            #end
            #set($senderField = "")
            #if($parsedPayload.containsKey('sender'))
              #set($sender = $parsedPayload.sender)
              #set($senderLogin = $util.escapeJavaScript($sender.login).replaceAll("\\'","'"))
              #set($senderType = $util.escapeJavaScript($sender.type).replaceAll("\\'","'"))
              #set($senderJson = "{${!quote}id${!quote}:$sender.id,${!quote}login${!quote}:${!quote}${!senderLogin}${!quote},${!quote}type${!quote}:${!quote}${!senderType}${!quote}}")
              #set($senderField = ",${!quote}sender${!quote}:${!senderJson}")
            #end
            #set($enrichedPayload = "{${!quote}id${!quote}:${!quote}${!deliveryId}${!quote},${!quote}received_at_epoch_ms${!quote}:${!receivedAtEpochMs},${!quote}event_type${!quote}:${!quote}${!eventType}${!quote},${!quote}action${!quote}:${!quote}${!action}${!quote}${!repositoryField}${!senderField},${!quote}raw_payload${!quote}:${!quote}${!rawPayload}${!quote}}")
            {
              "DeliveryStreamName": "${FirehoseDeliveryStream}",
              "Record": {
                "Data": "$util.base64Encode($enrichedPayload)"
              }
            }
        IntegrationResponses:
          - StatusCode: '500'
            SelectionPattern: '4\d{2}|5\d{2}'
            ResponseTemplates:
              application/json: '{"status": "error"}'
          - StatusCode: '200'
            ResponseTemplates:
              application/json: '{"status": "success"}'
      MethodResponses:
        - StatusCode: '200'
        - StatusCode: '500'

  # API Gateway deployments are immutable snapshots. Bump this logical ID when
  # the method or integration changes so CloudFormation publishes a new snapshot.
  WebhookDeploymentV13:
    Type: AWS::ApiGateway::Deployment
    DependsOn: WebhookPostMethod
    Properties:
      RestApiId: !Ref WebhookApi

  WebhookStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref WebhookDeploymentV13
      RestApiId: !Ref WebhookApi
      StageName: !Ref Environment
      Tags:
        - Key: owner
          Value: !Ref owner

  # 9. Athena workgroup with a managed S3 query result location
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "github-webhooks-${Environment}"
      Description: !Sub "Athena workgroup for GitHub webhook queries in ${Environment}"
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${WebhookS3Bucket}/athena-results/"
          ExpectedBucketOwner: !Ref AWS::AccountId
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
      Tags:
        - Key: owner
          Value: !Ref owner

  # 10. Scheduled webhook bronze-to-silver Iceberg normalization
  WebhookSilverGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "github_webhooks_silver_${Environment}"
        Description: Canonical and event-family GitHub webhook Iceberg tables.

  GlueScriptDeployerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/github-webhook-glue-script-deployer-${Environment}"
      RetentionInDays: 14
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  GlueScriptDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Publishes the packaged webhook silver Glue script to the data-lake bucket.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GlueScriptDeployerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageGlueScript
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:PutObject
                Resource: !Sub "${WebhookS3Bucket.Arn}/glue-scripts/webhook-silver.py"
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt GlueScriptDeployerLogGroup.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  GlueScriptDeployerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "github-webhook-glue-script-deployer-${Environment}"
      Description: Publishes the versioned webhook silver Glue job script during deployment.
      CodeUri: src/
      Handler: glue_script_deployer.app.lambda_handler
      Runtime: python3.12
      AutoPublishAlias: live
      Architectures:
        - arm64
      MemorySize: 128
      Timeout: 60
      Role: !GetAtt GlueScriptDeployerRole.Arn
      Tags:
        Environment: !Ref Environment
        Owner: !Ref owner
        Project: github-data-lake

  WebhookSilverScript:
    Type: Custom::GlueScript
    DependsOn: WebhookS3BucketPolicy
    Properties:
      ServiceToken: !GetAtt GlueScriptDeployerFunction.Arn
      BucketName: !Ref WebhookS3Bucket
      ScriptKey: glue-scripts/webhook-silver.py
      PublisherVersion: !Ref GlueScriptDeployerFunction.Version

  WebhookSilverGlueRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Reads webhook bronze Parquet and transactionally maintains silver Iceberg tables.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WebhookSilverGluePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InspectDataLakeBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt WebhookS3Bucket.Arn
              - Sid: ListDataLakePrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt WebhookS3Bucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - webhooks
                      - webhooks/*
                      - silver
                      - silver/*
                      - quarantine/webhooks
                      - quarantine/webhooks/*
                      - glue-scripts/webhook-silver.py
                      - glue-temp/webhook-silver
                      - glue-temp/webhook-silver/*
              - Sid: ReadBronzeAndJobScript
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub "${WebhookS3Bucket.Arn}/webhooks/*"
                  - !Sub "${WebhookS3Bucket.Arn}/glue-scripts/webhook-silver.py"
              - Sid: ManageSilverQuarantineAndTemporaryObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource:
                  - !Sub "${WebhookS3Bucket.Arn}/silver/*"
                  - !Sub "${WebhookS3Bucket.Arn}/quarantine/webhooks/*"
                  - !Sub "${WebhookS3Bucket.Arn}/glue-temp/webhook-silver/*"
              - Sid: ManageSilverCatalog
                Effect: Allow
                Action:
                  - glue:CreateTable
                  - glue:DeleteTable
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                  - glue:UpdateTable
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${WebhookSilverGlueDatabase}"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${WebhookSilverGlueDatabase}/*"
              - Sid: PublishSilverMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: GitHubDataLake/WebhookSilver
              - Sid: WriteGlueLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/jobs/*"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  WebhookSilverJob:
    Type: AWS::Glue::Job
    DependsOn: WebhookSilverScript
    Properties:
      Name: !Sub "github-webhook-silver-${Environment}"
      Description: Canonicalizes webhook deliveries and materializes event-family Iceberg tables.
      Role: !GetAtt WebhookSilverGlueRole.Arn
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: !Ref WebhookSilverNumberOfWorkers
      Timeout: 60
      MaxRetries: 1
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub "s3://${WebhookS3Bucket}/glue-scripts/webhook-silver.py"
      DefaultArguments:
        '--job-language': python
        '--datalake-formats': iceberg
        '--job-bookmark-option': job-bookmark-enable
        '--enable-continuous-cloudwatch-log': 'true'
        '--enable-metrics': 'true'
        '--enable-observability-metrics': 'true'
        '--TempDir': !Sub "s3://${WebhookS3Bucket}/glue-temp/webhook-silver/"
        '--environment': !Ref Environment
        '--bronze_path': !Sub "s3://${WebhookS3Bucket}/webhooks/"
        '--silver_database': !Ref WebhookSilverGlueDatabase
        '--warehouse_path': !Sub "s3://${WebhookS3Bucket}/silver/"
        '--quarantine_path': !Sub "s3://${WebhookS3Bucket}/quarantine/webhooks/"
        '--conf': !Sub >-
          spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://${WebhookS3Bucket}/silver/
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.session.timeZone=UTC
      Tags:
        Environment: !Ref Environment
        Owner: !Ref owner
        Project: github-data-lake
        DataLayer: silver

  WebhookSilverScheduleDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "github-webhook-silver-schedule-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  WebhookSilverSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows the webhook silver schedule to start one Glue job run.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/default"
      Policies:
        - PolicyName: StartWebhookSilverJob
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: glue:StartJobRun
                Resource: !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${WebhookSilverJob}"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt WebhookSilverScheduleDeadLetterQueue.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  WebhookSilverSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "github-webhook-silver-schedule-${Environment}"
      Description: Runs incremental webhook silver normalization on a fixed schedule.
      State: ENABLED
      ScheduleExpression: !Ref WebhookSilverScheduleExpression
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Sub "arn:${AWS::Partition}:scheduler:::aws-sdk:glue:startJobRun"
        RoleArn: !GetAtt WebhookSilverSchedulerRole.Arn
        Input: !Sub '{"JobName":"${WebhookSilverJob}"}'
        DeadLetterConfig:
          Arn: !GetAtt WebhookSilverScheduleDeadLetterQueue.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 3

  WebhookSilverJobFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "github-webhook-silver-job-failure-${Environment}"
      Description: Publishes failed, timed-out, or stopped webhook silver Glue runs.
      State: ENABLED
      EventPattern:
        source:
          - aws.glue
        detail-type:
          - Glue Job State Change
        detail:
          jobName:
            - !Ref WebhookSilverJob
          state:
            - FAILED
            - TIMEOUT
            - STOPPED
      Targets:
        - Id: WebhookSilverAlarmTopic
          Arn: !Ref AuditLogAlarmTopic

  WebhookSilverQuarantineAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-webhook-silver-quarantine-${Environment}"
      AlarmDescription: Webhook records were quarantined for validation or integrity conflicts.
      Namespace: GitHubDataLake/WebhookSilver
      MetricName: QuarantinedRows
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  WebhookSilverScheduleDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-webhook-silver-schedule-dlq-${Environment}"
      AlarmDescription: The scheduler could not start the webhook silver Glue job.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WebhookSilverScheduleDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  # 11. Immutable raw landing zone for GitHub Enterprise Cloud audit-log streaming
  AuditLogS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "github-audit-logs-raw-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditLogS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AuditLogS3Bucket.Arn
              - !Sub "${AuditLogS3Bucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # GitHub uses a dedicated OIDC issuer for enterprise audit-log streaming.
  GitHubAuditLogOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateGitHubAuditLogOidcProvider
    Properties:
      Url: https://oidc-configuration.audit-log.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  GitHubAuditLogWriterRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows one GitHub enterprise audit-log stream to write raw objects to S3.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated:
                Fn::If:
                  - ShouldCreateGitHubAuditLogOidcProvider
                  - Ref: GitHubAuditLogOidcProvider
                  - Fn::Sub: "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/oidc-configuration.audit-log.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc-configuration.audit-log.githubusercontent.com:aud: sts.amazonaws.com
                oidc-configuration.audit-log.githubusercontent.com:sub: !Sub "https://github.com/${GitHubEnterpriseSlug}"
      Policies:
        - PolicyName: GitHubAuditLogS3WritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${AuditLogS3Bucket.Arn}/*"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "github_audit_logs_bronze_${Environment}"
        Description: Raw and normalized GitHub enterprise audit-log catalog.

  AuditLogRawTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref AuditLogGlueDatabase
      TableInput:
        Name: raw_events
        Description: GitHub enterprise audit-log gzip JSON objects queried directly from S3.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          EXTERNAL: 'TRUE'
          projection.enabled: 'true'
          projection.year.type: integer
          projection.year.range: '2020,2040'
          projection.year.digits: '4'
          projection.month.type: integer
          projection.month.range: '1,12'
          projection.month.digits: '2'
          projection.day.type: integer
          projection.day.range: '1,31'
          projection.day.digits: '2'
          projection.hour.type: integer
          projection.hour.range: '0,23'
          projection.hour.digits: '2'
          projection.minute.type: integer
          projection.minute.range: '0,59'
          projection.minute.digits: '2'
          storage.location.template: !Sub "s3://${AuditLogS3Bucket}/${!year}/${!month}/${!day}/${!hour}/${!minute}/"
        StorageDescriptor:
          Location: !Sub "s3://${AuditLogS3Bucket}/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              case.insensitive: 'false'
              ignore.malformed.json: 'true'
              mapping.event_timestamp: '@timestamp'
              mapping.document_id: '_document_id'
          Columns:
            - Name: event_timestamp
              Type: bigint
              Comment: Event occurrence time as Unix epoch milliseconds.
            - Name: document_id
              Type: string
              Comment: GitHub audit event identifier used for deduplication.
            - Name: action
              Type: string
            - Name: actor
              Type: string
            - Name: actor_id
              Type: bigint
            - Name: actor_ip
              Type: string
            - Name: actor_is_bot
              Type: boolean
            - Name: business
              Type: string
            - Name: business_id
              Type: bigint
            - Name: created_at
              Type: bigint
            - Name: operation_type
              Type: string
            - Name: org
              Type: string
            - Name: org_id
              Type: bigint
            - Name: repo
              Type: string
            - Name: repo_id
              Type: bigint
            - Name: repository
              Type: string
            - Name: repository_id
              Type: bigint
            - Name: user
              Type: string
            - Name: user_id
              Type: bigint
            - Name: request_id
              Type: string
            - Name: user_agent
              Type: string
            - Name: programmatic_access_type
              Type: string
            - Name: request_method
              Type: string
            - Name: route
              Type: string
            - Name: status_code
              Type: int
            - Name: url_path
              Type: string
            - Name: pull_request_id
              Type: bigint
            - Name: workflow_run_id
              Type: bigint
        PartitionKeys:
          - Name: year
            Type: string
          - Name: month
            Type: string
          - Name: day
            Type: string
          - Name: hour
            Type: string
          - Name: minute
            Type: string

  AuditLogBronzeTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref AuditLogGlueDatabase
      TableInput:
        Name: bronze_events
        Description: Normalized GitHub enterprise audit events stored as Parquet.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          EXTERNAL: 'TRUE'
          projection.enabled: 'true'
          projection.year.type: integer
          projection.year.range: '2020,2040'
          projection.year.digits: '4'
          projection.month.type: integer
          projection.month.range: '1,12'
          projection.month.digits: '2'
          projection.day.type: integer
          projection.day.range: '1,31'
          projection.day.digits: '2'
          projection.hour.type: integer
          projection.hour.range: '0,23'
          projection.hour.digits: '2'
          storage.location.template: !Sub "s3://${WebhookS3Bucket}/audit-logs/year=${!year}/month=${!month}/day=${!day}/hour=${!hour}/"
        StorageDescriptor:
          Location: !Sub "s3://${WebhookS3Bucket}/audit-logs/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          Compressed: true
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
            Parameters:
              serialization.format: '1'
          Columns:
            - Name: document_id
              Type: string
              Comment: GitHub document ID or a deterministic payload hash fallback.
            - Name: event_timestamp
              Type: timestamp
              Comment: Event occurrence time normalized to UTC.
            - Name: action
              Type: string
            - Name: action_category
              Type: string
            - Name: action_name
              Type: string
            - Name: operation_type
              Type: string
            - Name: actor
              Type: string
            - Name: actor_id
              Type: bigint
            - Name: actor_is_bot
              Type: boolean
            - Name: business
              Type: string
            - Name: business_id
              Type: bigint
            - Name: organization
              Type: string
            - Name: organization_id
              Type: bigint
            - Name: repository
              Type: string
            - Name: repository_id
              Type: bigint
            - Name: user
              Type: string
            - Name: user_id
              Type: bigint
            - Name: request_id
              Type: string
            - Name: source_ip
              Type: string
              Comment: Sensitive source address; restrict access in curated layers.
            - Name: user_agent
              Type: string
            - Name: programmatic_access_type
              Type: string
            - Name: request_method
              Type: string
            - Name: route
              Type: string
            - Name: status_code
              Type: int
            - Name: url_path
              Type: string
            - Name: pull_request_id
              Type: bigint
            - Name: workflow_run_id
              Type: bigint
            - Name: raw_payload
              Type: string
              Comment: Sensitive original event JSON; restrict access in curated layers.
            - Name: payload_sha256
              Type: string
            - Name: source_bucket
              Type: string
            - Name: source_object_key
              Type: string
            - Name: source_object_version
              Type: string
            - Name: source_record_index
              Type: int
            - Name: schema_version
              Type: int
            - Name: normalized_at
              Type: timestamp
            - Name: record_family
              Type: string
              Comment: Audit or Copilot usage record family.
            - Name: copilot_record_type
              Type: string
              Comment: Copilot usage record direction; request or response.
            - Name: event_id
              Type: string
              Comment: Source event identifier used to deduplicate Copilot usage records.
            - Name: github_request_id
              Type: string
              Comment: Correlation key joining Copilot request and response records.
            - Name: enterprise_id
              Type: bigint
              Comment: Enterprise identifier from a Copilot usage record.
            - Name: endpoint
              Type: string
              Comment: Copilot API endpoint without request or response content.
            - Name: truncated
              Type: boolean
              Comment: Whether GitHub truncated the Copilot usage record body.
        PartitionKeys:
          - Name: year
            Type: string
          - Name: month
            Type: string
          - Name: day
            Type: string
          - Name: hour
            Type: string

  AuditLogFirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/github-audit-logs-bronze-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogFirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref AuditLogFirehoseLogGroup
      LogStreamName: S3Delivery

  AuditLogFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Allows the audit-log Firehose stream to write Parquet and read its Glue schema.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AuditLogFirehoseDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InspectDestinationBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt WebhookS3Bucket.Arn
              - Sid: ListDestinationPrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt WebhookS3Bucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - audit-logs/*
                      - audit-logs-errors/*
              - Sid: WriteAuditLogObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "${WebhookS3Bucket.Arn}/audit-logs/*"
                  - !Sub "${WebhookS3Bucket.Arn}/audit-logs-errors/*"
              - Sid: ReadAuditLogSchema
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                Resource:
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${AuditLogGlueDatabase}"
                  - !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${AuditLogGlueDatabase}/bronze_events"
              - Sid: WriteDeliveryLogs
                Effect: Allow
                Action: logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${AuditLogFirehoseLogGroup}:log-stream:${AuditLogFirehoseLogStream}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogFirehoseDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "github-audit-logs-bronze-${Environment}"
      DeliveryStreamType: DirectPut
      DeliveryStreamEncryptionConfigurationInput:
        KeyType: AWS_OWNED_CMK
      ExtendedS3DestinationConfiguration:
        RoleARN: !GetAtt AuditLogFirehoseRole.Arn
        BucketARN: !GetAtt WebhookS3Bucket.Arn
        Prefix: "audit-logs/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/hour=!{timestamp:HH}/"
        ErrorOutputPrefix: "audit-logs-errors/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/hour=!{timestamp:HH}/!{firehose:error-output-type}/"
        BufferingHints:
          IntervalInSeconds: 300
          SizeInMBs: 64
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref AuditLogFirehoseLogGroup
          LogStreamName: !Ref AuditLogFirehoseLogStream
        CompressionFormat: UNCOMPRESSED
        DataFormatConversionConfiguration:
          Enabled: true
          InputFormatConfiguration:
            Deserializer:
              HiveJsonSerDe:
                TimestampFormats:
                  - "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'"
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe:
                Compression: SNAPPY
                EnableDictionaryCompression: true
                WriterVersion: V2
          SchemaConfiguration:
            CatalogId: !Ref AWS::AccountId
            DatabaseName: !Ref AuditLogGlueDatabase
            TableName: !Ref AuditLogBronzeTable
            RoleARN: !GetAtt AuditLogFirehoseRole.Arn
            Region: !Ref AWS::Region
            VersionId: LATEST
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "github-audit-log-dlq-${Environment}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogIngestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "github-audit-log-ingest-${Environment}"
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 900
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AuditLogDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AuditLogIngestQueue
        - !Ref AuditLogDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAuditLogEventRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt AuditLogIngestQueue.Arn
              - !GetAtt AuditLogDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/github-audit-log-object-created-${Environment}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AuditLogObjectCreatedRule:
    Type: AWS::Events::Rule
    DependsOn: AuditLogQueuePolicy
    Properties:
      Name: !Sub "github-audit-log-object-created-${Environment}"
      Description: Routes GitHub audit-log gzip object arrivals to the normalizer queue.
      State: ENABLED
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref AuditLogS3Bucket
          object:
            key:
              - suffix: .json.log.gz
      Targets:
        - Id: AuditLogIngestQueue
          Arn: !GetAtt AuditLogIngestQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt AuditLogDeadLetterQueue.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 10

  AuditLogNormalizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/github-audit-log-normalizer-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogNormalizerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Reads raw GitHub audit objects and writes normalized records to Firehose.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AuditLogNormalizerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConsumeAuditLogQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt AuditLogIngestQueue.Arn
              - Sid: ReadRawAuditObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${AuditLogS3Bucket.Arn}/*"
              - Sid: WriteQuarantineMetadata
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${WebhookS3Bucket.Arn}/quarantine/audit-logs/*"
              - Sid: SubmitNormalizedRecords
                Effect: Allow
                Action: firehose:PutRecordBatch
                Resource: !GetAtt AuditLogFirehoseDeliveryStream.Arn
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuditLogNormalizerLogGroup.Arn
              - Sid: PublishXRayTelemetry
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogNormalizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "github-audit-log-normalizer-${Environment}"
      Description: Normalizes batched GitHub audit-log gzip objects for Parquet conversion.
      CodeUri: src/audit_normalizer/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 120
      ReservedConcurrentExecutions: !Ref AuditLogNormalizerReservedConcurrency
      Tracing: Active
      Role: !GetAtt AuditLogNormalizerRole.Arn
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref AuditLogS3Bucket
          DESTINATION_STREAM_NAME: !Ref AuditLogFirehoseDeliveryStream
          QUARANTINE_BUCKET: !Ref WebhookS3Bucket
          QUARANTINE_PREFIX: quarantine/audit-logs
          ENVIRONMENT: !Ref Environment
          SCHEMA_VERSION: '2'
          MAX_COMPRESSED_BYTES: '20971520'
          MAX_UNCOMPRESSED_BYTES: '104857600'
      Events:
        AuditLogQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt AuditLogIngestQueue.Arn
            BatchSize: 5
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: !Ref AuditLogNormalizerReservedConcurrency
      Tags:
        Environment: !Ref Environment
        Owner: !Ref owner
        Project: github-data-lake

  AuditLogReplayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/github-audit-log-replay-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogReplayRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lists retained raw audit objects and enqueues controlled replay batches.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AuditLogReplayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListRawAuditObjects
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AuditLogS3Bucket.Arn
              - Sid: EnqueueAuditLogReplay
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt AuditLogIngestQueue.Arn
              - Sid: WriteReplayLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuditLogReplayLogGroup.Arn
              - Sid: PublishXRayTelemetry
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogReplayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "github-audit-log-replay-${Environment}"
      Description: Batch-enqueues retained raw audit objects for normalization and recovery.
      CodeUri: src/audit_replay/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 300
      Tracing: Active
      Role: !GetAtt AuditLogReplayRole.Arn
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref AuditLogS3Bucket
          DESTINATION_QUEUE_URL: !Ref AuditLogIngestQueue
      Tags:
        Environment: !Ref Environment
        Owner: !Ref owner
        Project: github-data-lake

  AuditLogAlarmKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts GitHub audit-log pipeline alarm notifications.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: '*'
          - Sid: AllowMonitoringNotifications
            Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:github-audit-log-*"
                  - !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:github-webhook-silver-*"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/github-webhook-silver-job-failure-${Environment}"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogAlarmKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/github-audit-log-alarms-${Environment}"
      TargetKeyId: !Ref AuditLogAlarmKey

  AuditLogAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "github-audit-log-alarms-${Environment}"
      KmsMasterKeyId: !GetAtt AuditLogAlarmKey.Arn
      Subscription:
        Fn::If:
          - HasAuditLogAlarmEmail
          - - Protocol: email
              Endpoint: !Ref AuditLogAlarmEmail
          - Ref: AWS::NoValue
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AuditLogAlarmTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AuditLogAlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:github-audit-log-*"
                  - !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:github-webhook-silver-*"
          - Sid: AllowWebhookSilverFailureEvents
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AuditLogAlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/github-webhook-silver-job-failure-${Environment}"

  AuditLogQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-audit-log-queue-age-${Environment}"
      AlarmDescription: Audit-log normalization queue has messages older than ten minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AuditLogIngestQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 600
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-audit-log-dlq-depth-${Environment}"
      AlarmDescription: Audit-log messages require investigation or redrive.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AuditLogDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogNormalizerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-audit-log-normalizer-errors-${Environment}"
      AlarmDescription: Audit-log normalizer returned an invocation error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AuditLogNormalizerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogNormalizerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-audit-log-normalizer-throttles-${Environment}"
      AlarmDescription: Audit-log normalizer concurrency is insufficient for current traffic.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AuditLogNormalizerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogSourceFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-audit-log-source-failures-${Environment}"
      AlarmDescription: One or more raw audit objects failed transient processing.
      Namespace: GitHubDataLake/AuditLogs
      MetricName: SourceObjectsFailed
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogQuarantineAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-audit-log-quarantine-${Environment}"
      AlarmDescription: Audit records were quarantined for source or schema validation failures.
      Namespace: GitHubDataLake/AuditLogs
      MetricName: RecordsQuarantined
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogFirehoseFreshnessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-audit-log-firehose-freshness-${Environment}"
      AlarmDescription: Audit-log Firehose delivery is more than fifteen minutes behind.
      Namespace: AWS/Firehose
      MetricName: DeliveryToS3.DataFreshness
      Dimensions:
        - Name: DeliveryStreamName
          Value: !Ref AuditLogFirehoseDeliveryStream
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

  AuditLogFirehoseDeliveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "github-audit-log-firehose-delivery-${Environment}"
      AlarmDescription: Audit-log Firehose is not successfully delivering all records to S3.
      Namespace: AWS/Firehose
      MetricName: DeliveryToS3.Success
      Dimensions:
        - Name: DeliveryStreamName
          Value: !Ref AuditLogFirehoseDeliveryStream
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AuditLogAlarmTopic
      OKActions:
        - !Ref AuditLogAlarmTopic
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref owner
        - Key: Project
          Value: github-data-lake

Outputs:
  WebhookEndpoint:
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/events"
    Description: "Provide this exact URL to your GitHub Webhook configuration payload URL field"
  S3BucketName:
    Value: !Ref WebhookS3Bucket
    Description: "The name of your deployed Parquet data lake S3 bucket"
  GlueDatabaseName:
    Value: !Ref GlueDatabase
    Description: "The name of your Glue database for Athena queries"
  FirehoseLogGroupName:
    Value: !Ref FirehoseLogGroup
    Description: "The CloudWatch log group containing Firehose delivery errors"
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
    Description: "Select this workgroup in the Athena query editor before running queries"
  AthenaQueryResultsLocation:
    Value: !Sub "s3://${WebhookS3Bucket}/athena-results/"
    Description: "The S3 location used for Athena query results"
  AuditLogS3BucketName:
    Value: !Ref AuditLogS3Bucket
    Description: "Configure this bucket as the GitHub enterprise audit-log S3 destination"
  AuditLogS3Region:
    Value: !Ref AWS::Region
    Description: "Select this region when configuring the GitHub audit-log stream"
  AuditLogWriterRoleArn:
    Value: !GetAtt GitHubAuditLogWriterRole.Arn
    Description: "Enter this value in GitHub's ARN Role field for audit-log streaming with OIDC"
  AuditLogGlueDatabaseName:
    Value: !Ref AuditLogGlueDatabase
    Description: "Glue database reserved for raw and normalized GitHub audit logs"
  AuditLogRawTableName:
    Value: !Ref AuditLogRawTable
    Description: "Athena table for querying raw GitHub audit-log gzip JSON objects"
  AuditLogBronzeTableName:
    Value: !Ref AuditLogBronzeTable
    Description: "Athena table for normalized GitHub audit-log Parquet records"
  AuditLogIngestQueueUrl:
    Value: !Ref AuditLogIngestQueue
    Description: "SQS queue URL used for audit-log ingestion and controlled replay"
  AuditLogDeadLetterQueueUrl:
    Value: !Ref AuditLogDeadLetterQueue
    Description: "SQS dead-letter queue URL for failed audit-log processing"
  AuditLogNormalizerFunctionName:
    Value: !Ref AuditLogNormalizerFunction
    Description: "Lambda function that normalizes raw GitHub audit-log objects"
  AuditLogReplayFunctionName:
    Value: !Ref AuditLogReplayFunction
    Description: "Lambda function for bounded audit-log backfill and replay batches"
  AuditLogFirehoseDeliveryStreamName:
    Value: !Ref AuditLogFirehoseDeliveryStream
    Description: "Firehose stream that converts normalized audit logs to Parquet"
  AuditLogAlarmTopicArn:
    Value: !Ref AuditLogAlarmTopic
    Description: "SNS topic for audit-log pipeline alarms"
  WebhookSilverGlueDatabaseName:
    Value: !Ref WebhookSilverGlueDatabase
    Description: "Glue database containing canonical and event-family webhook Iceberg tables"
  WebhookSilverGlueJobName:
    Value: !Ref WebhookSilverJob
    Description: "Scheduled Glue job for webhook bronze-to-silver normalization and backfills"
  WebhookSilverScheduleName:
    Value: !Ref WebhookSilverSchedule
    Description: "EventBridge Scheduler schedule that starts incremental webhook silver normalization"
  WebhookSilverScheduleDeadLetterQueueUrl:
    Value: !Ref WebhookSilverScheduleDeadLetterQueue
    Description: "SQS queue containing failed attempts to start the webhook silver Glue job"
  WebhookSilverWarehouseLocation:
    Value: !Sub "s3://${WebhookS3Bucket}/silver/"
    Description: "S3 warehouse root for webhook silver Iceberg tables"
  WebhookSilverQuarantineLocation:
    Value: !Sub "s3://${WebhookS3Bucket}/quarantine/webhooks/"
    Description: "S3 location for the webhook silver quarantine Iceberg table"
