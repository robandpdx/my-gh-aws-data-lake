AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'AWS Infrastructure for ingesting GitHub Webhooks to S3 in Parquet format via API Gateway and Amazon Data Firehose.'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Environment stage for deployment.
  owner:
    Type: String
    Default: robandpdx
    Description: Owner applied to all taggable resources.

Resources:
  # 1. Amazon S3 Bucket for Data Lake Storage
  WebhookS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "github-webhooks-parquet-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: owner
          Value: !Ref owner

  # 2. AWS Glue Database
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "github_webhooks_${Environment}"
        Description: "Database for GitHub webhooks ingested as Parquet"

  # 3. AWS Glue Table (Defines Parquet schema with core metadata and flexible payload)
  GlueTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: events
        Description: "Table storing GitHub webhook events"
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          has_encrypted_data: 'false'
        StorageDescriptor:
          Location: !Sub "s3://${WebhookS3Bucket}/webhooks/"
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          Compressed: true
          NumberOfBuckets: -1
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
            Parameters:
              serialization.format: '1'
          Columns:
            - Name: id
              Type: string
              Comment: "GitHub Event ID"
            - Name: event_type
              Type: string
              Comment: "GitHub Event Type header"
            - Name: action
              Type: string
              Comment: "Specific action taken"
            - Name: repository
              Type: struct<id:bigint,name:string,full_name:string,html_url:string>
              Comment: "Basic repository metadata struct"
            - Name: sender
              Type: struct<id:bigint,login:string,type:string>
              Comment: "User who triggered the event"
            - Name: raw_payload
              Type: string
              Comment: "Full JSON string payload to handle GitHub polymorphism safely"
        PartitionKeys:
          - Name: year
            Type: string
          - Name: month
            Type: string
          - Name: day
            Type: string

  # 4. CloudWatch Logs for Firehose delivery errors
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/github-webhooks-parquet-stream-${Environment}"
      RetentionInDays: 30
      Tags:
        - Key: owner
          Value: !Ref owner

  FirehoseLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: S3Delivery

  # 5. IAM Role for Firehose
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirehoseDeliveryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt WebhookS3Bucket.Arn
                  - !Sub "${WebhookS3Bucket.Arn}/*"
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/events"
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FirehoseLogGroup}:log-stream:${FirehoseLogStream}"
      Tags:
        - Key: owner
          Value: !Ref owner

  # 6. Amazon Data Firehose Delivery Stream
  FirehoseDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "github-webhooks-parquet-stream-${Environment}"
      DeliveryStreamType: DirectPut
      Tags:
        - Key: owner
          Value: !Ref owner
      ExtendedS3DestinationConfiguration:
        RoleARN: !GetAtt FirehoseRole.Arn
        BucketARN: !GetAtt WebhookS3Bucket.Arn
        Prefix: "webhooks/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/"
        ErrorOutputPrefix: "webhooks-errors/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/!{firehose:error-output-type}/"
        BufferingHints:
          IntervalInSeconds: 300
          SizeInMBs: 64
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: !Ref FirehoseLogStream
        CompressionFormat: UNCOMPRESSED # Format conversion handles its own internal Parquet compression (Snappy)
        DataFormatConversionConfiguration:
          Enabled: true
          InputFormatConfiguration:
            Deserializer:
              OpenXJsonSerDe: {}
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe: {}
          SchemaConfiguration:
            DatabaseName: !Ref GlueDatabase
            TableName: events
            RoleARN: !GetAtt FirehoseRole.Arn
            Region: !Ref AWS::Region
            VersionId: LATEST

  # 7. IAM Role for API Gateway to write directly to Firehose
  ApiGatewayFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayFirehosePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                Resource: !GetAtt FirehoseDeliveryStream.Arn
      Tags:
        - Key: owner
          Value: !Ref owner

  # 8. Amazon API Gateway (REST API)
  WebhookApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "github-webhooks-ingest-${Environment}"
      Description: "API Gateway backend endpoint to ingest GitHub Webhooks directly into Data Firehose"
      Tags:
        - Key: owner
          Value: !Ref owner

  WebhookResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt WebhookApi.RootResourceId
      PathPart: events
      RestApiId: !Ref WebhookApi

  # POST Method integrating straight to Firehose via AWS Service Proxy
  WebhookPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref WebhookResource
      RestApiId: !Ref WebhookApi
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:firehose:action/PutRecord"
        Credentials: !GetAtt ApiGatewayFirehoseRole.Arn
        PassthroughBehavior: NEVER
        RequestTemplates:
          application/json: !Sub |
            #set($quote = '"')
            #set($root = $input.path('$'))
            #set($rawPayload = $util.escapeJavaScript($input.body).replaceAll("\\'","'"))
            #set($deliveryId = $util.escapeJavaScript($input.params().header.get('X-GitHub-Delivery')).replaceAll("\\'","'"))
            #set($eventType = $util.escapeJavaScript($input.params().header.get('X-GitHub-Event')).replaceAll("\\'","'"))
            #set($action = '')
            #if($root.action)
              #set($action = $util.escapeJavaScript($root.action).replaceAll("\\'","'"))
            #end
            #set($repositoryField = "")
            #set($repository = $input.json('$.repository'))
            #if($repository != '""')
              #set($repositoryField = ",${!quote}repository${!quote}:${!repository}")
            #end
            #set($senderField = "")
            #set($sender = $input.json('$.sender'))
            #if($sender != '""')
              #set($senderField = ",${!quote}sender${!quote}:${!sender}")
            #end
            #set($enrichedPayload = "{${!quote}id${!quote}:${!quote}${!deliveryId}${!quote},${!quote}event_type${!quote}:${!quote}${!eventType}${!quote},${!quote}action${!quote}:${!quote}${!action}${!quote}${!repositoryField}${!senderField},${!quote}raw_payload${!quote}:${!quote}${!rawPayload}${!quote}}")
            {
              "DeliveryStreamName": "${FirehoseDeliveryStream}",
              "Record": {
                "Data": "$util.base64Encode($enrichedPayload)"
              }
            }
          application/x-www-form-urlencoded: !Sub |
            #set($quote = '"')
            #set($encodedPayload = $input.body.substring(8))
            #set($payload = $util.urlDecode($encodedPayload))
            #set($parsedPayload = $util.parseJson($payload))
            #set($rawPayload = $util.escapeJavaScript($payload).replaceAll("\\'","'"))
            #set($deliveryId = $util.escapeJavaScript($input.params().header.get('X-GitHub-Delivery')).replaceAll("\\'","'"))
            #set($eventType = $util.escapeJavaScript($input.params().header.get('X-GitHub-Event')).replaceAll("\\'","'"))
            #set($action = '')
            #if($parsedPayload.action)
              #set($action = $util.escapeJavaScript($parsedPayload.action).replaceAll("\\'","'"))
            #end
            #set($repositoryField = "")
            #if($parsedPayload.repository)
              #set($repository = $parsedPayload.repository)
              #set($repositoryName = $util.escapeJavaScript($repository.name).replaceAll("\\'","'"))
              #set($repositoryFullName = $util.escapeJavaScript($repository.full_name).replaceAll("\\'","'"))
              #set($repositoryUrl = $util.escapeJavaScript($repository.html_url).replaceAll("\\'","'"))
              #set($repositoryJson = "{${!quote}id${!quote}:$repository.id,${!quote}name${!quote}:${!quote}${!repositoryName}${!quote},${!quote}full_name${!quote}:${!quote}${!repositoryFullName}${!quote},${!quote}html_url${!quote}:${!quote}${!repositoryUrl}${!quote}}")
              #set($repositoryField = ",${!quote}repository${!quote}:${!repositoryJson}")
            #end
            #set($senderField = "")
            #if($parsedPayload.sender)
              #set($sender = $parsedPayload.sender)
              #set($senderLogin = $util.escapeJavaScript($sender.login).replaceAll("\\'","'"))
              #set($senderType = $util.escapeJavaScript($sender.type).replaceAll("\\'","'"))
              #set($senderJson = "{${!quote}id${!quote}:$sender.id,${!quote}login${!quote}:${!quote}${!senderLogin}${!quote},${!quote}type${!quote}:${!quote}${!senderType}${!quote}}")
              #set($senderField = ",${!quote}sender${!quote}:${!senderJson}")
            #end
            #set($enrichedPayload = "{${!quote}id${!quote}:${!quote}${!deliveryId}${!quote},${!quote}event_type${!quote}:${!quote}${!eventType}${!quote},${!quote}action${!quote}:${!quote}${!action}${!quote}${!repositoryField}${!senderField},${!quote}raw_payload${!quote}:${!quote}${!rawPayload}${!quote}}")
            {
              "DeliveryStreamName": "${FirehoseDeliveryStream}",
              "Record": {
                "Data": "$util.base64Encode($enrichedPayload)"
              }
            }
        IntegrationResponses:
          - StatusCode: '500'
            SelectionPattern: '4\d{2}|5\d{2}'
            ResponseTemplates:
              application/json: '{"status": "error"}'
          - StatusCode: '200'
            ResponseTemplates:
              application/json: '{"status": "success"}'
      MethodResponses:
        - StatusCode: '200'
        - StatusCode: '500'

  # API Gateway deployments are immutable snapshots. Bump this logical ID when
  # the method or integration changes so CloudFormation publishes a new snapshot.
  WebhookDeploymentV11:
    Type: AWS::ApiGateway::Deployment
    DependsOn: WebhookPostMethod
    Properties:
      RestApiId: !Ref WebhookApi

  WebhookStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref WebhookDeploymentV11
      RestApiId: !Ref WebhookApi
      StageName: !Ref Environment
      Tags:
        - Key: owner
          Value: !Ref owner

  # 9. Athena workgroup with a managed S3 query result location
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "github-webhooks-${Environment}"
      Description: !Sub "Athena workgroup for GitHub webhook queries in ${Environment}"
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${WebhookS3Bucket}/athena-results/"
          ExpectedBucketOwner: !Ref AWS::AccountId
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
      Tags:
        - Key: owner
          Value: !Ref owner

Outputs:
  WebhookEndpoint:
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/events"
    Description: "Provide this exact URL to your GitHub Webhook configuration payload URL field"
  S3BucketName:
    Value: !Ref WebhookS3Bucket
    Description: "The name of your deployed Parquet data lake S3 bucket"
  GlueDatabaseName:
    Value: !Ref GlueDatabase
    Description: "The name of your Glue database for Athena queries"
  FirehoseLogGroupName:
    Value: !Ref FirehoseLogGroup
    Description: "The CloudWatch log group containing Firehose delivery errors"
  AthenaWorkGroupName:
    Value: !Ref AthenaWorkGroup
    Description: "Select this workgroup in the Athena query editor before running queries"
  AthenaQueryResultsLocation:
    Value: !Sub "s3://${WebhookS3Bucket}/athena-results/"
    Description: "The S3 location used for Athena query results"
